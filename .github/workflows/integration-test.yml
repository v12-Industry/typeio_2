name: Integration Test

# Runs the Docker-backed integration test suite
# (docs/solution-proposals/integration-testing.md) on every PR into
# main. Deliberately a SEPARATE workflow from test.yml's `test` job, and
# NOT a required status check -- see docs/development/ci.md for why:
# this suite is slower and needs Docker on the runner, and a required
# check has no bypass on this repo (`enforce_admins: true`). It runs as
# informational; promoting it to required is its own deliberate
# branch-protection change, once it's been reliable
# for a while.
#
# Because it's not required, a plain top-level `paths:` filter is safe
# here -- unlike test.yml, which deliberately avoids one. A required
# check that a path filter prevents from ever running gets stuck
# "missing" forever and blocks merging with no bypass; that trap only
# bites required checks (see docs/development/ci.md's "Why it always
# runs" writeup for the incident this comes from). An informational
# check just... doesn't run, which is fine.
on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.hs'
      - '*.cabal'
      - 'cabal.project'
      - 'migrations/**'
      - 'test-integration/**'
      - '.github/workflows/integration-test.yml'

# Same reasoning as test.yml: a second push to the same PR should
# replace the first run, not queue a second one alongside it.
concurrency:
  group: integration-test-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration-test:
    # Same pinned-OS reasoning as test.yml. GitHub-hosted Ubuntu runners
    # come with Docker preinstalled and already running -- no setup step
    # needed for it. No `migrate` CLI install step either: migrations
    # apply themselves, from inside the disposable container, via
    # docker-entrypoint-initdb.d (test-integration/Integration/Support.hs).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: haskell-actions/setup@v2
        with:
          # Same pinned versions as test.yml -- see typeio.cabal's
          # `base ^>=4.18.3.0` bound and docs/development/onboarding.md.
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'

      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('typeio.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: cabal build all
        run: cabal build all

      - name: cabal test integration
        run: cabal test integration --test-show-details=streaming
