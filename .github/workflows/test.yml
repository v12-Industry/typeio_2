name: Test

# Runs on every PR into main, and on every entry into main's merge queue
# -- not on push to main. Anything landing on main only got there via a
# PR (or a merge-queue group) that already passed this same check, so
# re-running it there is redundant. See docs/development/ci.md.
#
# `merge_group` matters here specifically because `test` is one of the
# checks in main's `required_status_checks` (both the classic branch
# protection contexts list and the "main merge queue" ruleset's own
# required_status_checks rule; `integration-test` is the other) -- the
# merge queue evaluates required
# checks against a synthetic merge-group ref, which does NOT fire a
# `pull_request` event. Without this trigger, `test` would never run for
# a queued entry, GitHub would see it as permanently missing (not
# failing), and nothing would ever clear the queue.
#
# Deliberately NOT path-filtered at the workflow level (see the
# "changes" step below for why): branch protection requires this check
# to pass before merging, and a required check that a path filter
# prevents from ever running can never be satisfied -- GitHub has no
# concept of "this check doesn't apply here," only "passed" or
# "missing," and "missing" blocks the merge forever. Every PR, including
# docs-only ones, needs this workflow to at least run and report a
# result.
on:
  pull_request:
    branches: [main]
  merge_group:

# Without this, pushing a second commit to the same PR (or the queue
# re-forming a merge group) starts a second, fully concurrent run rather
# than replacing the first -- doubling CI minutes for no benefit, since
# only the latest commit's result matters. `github.event.merge_group`
# has no `pull_request.number`, so fall back to its own unique
# `head_ref` (per merge-group entry), then finally `github.ref` -- same
# fallback-chain pattern e2e-test.yml's concurrency group already uses.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned to a specific Ubuntu release, not the floating `ubuntu-latest`
    # label -- GitHub-hosted runners can't be pinned to an exact image
    # digest (that needs a container-based job instead), so a fixed OS
    # version is the closest available equivalent. The GHC/cabal versions
    # below are what actually matters for build reproducibility, and
    # those are already pinned explicitly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base branch's history to diff against below

      # The job itself always runs (so the required check always exists
      # and can report success quickly for e.g. docs-only PRs), but the
      # expensive steps below are skipped unless something that could
      # actually affect the build/test result changed. Keep this pattern
      # in sync with anything the later steps depend on.
      #
      # `github.base_ref` is only set for pull_request events -- empty
      # for merge_group, which carries the base ref at
      # `github.event.merge_group.base_ref` instead (as a full ref, e.g.
      # `refs/heads/main`, not a bare branch name). HEAD for a
      # merge_group run is the merge group's own combined ref (main plus
      # every PR queued ahead of this one), so this diffs the whole
      # group against main -- correctly relevant=true if anything queued
      # touches Haskell, not just this one entry's own changes.
      - name: Check for Haskell-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            base_ref="${{ github.event.merge_group.base_ref }}"
            base="origin/${base_ref#refs/heads/}"
          else
            base="origin/${{ github.base_ref }}"
          fi
          if git diff --name-only "$base...HEAD" \
              | grep -qE '\.hs$|\.cabal$|^cabal\.project$|^\.github/workflows/test\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - id: setup
        if: steps.changes.outputs.relevant == 'true'
        uses: haskell-actions/setup@v2
        with:
          # Matches the versions used locally -- see typeio.cabal's
          # `base ^>=4.18.3.0` bound and README/docs/development/onboarding.md.
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'

      - uses: actions/cache@v6
        if: steps.changes.outputs.relevant == 'true'
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('typeio.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: cabal build all
        if: steps.changes.outputs.relevant == 'true'
        run: cabal build all

      # Scoped to `spec` specifically, not a bare `cabal test` -- a bare
      # `cabal test` builds and runs every test-suite in the package,
      # which also includes `integration`
      # (docs/solution-proposals/integration-testing.md). That suite has
      # its own separate workflow (integration-test.yml) -- keep this
      # job scoped to the fast, DB-free unit suite only, so a Docker
      # dependency never leaks into it.
      - name: cabal test
        if: steps.changes.outputs.relevant == 'true'
        run: cabal test spec --test-show-details=streaming
