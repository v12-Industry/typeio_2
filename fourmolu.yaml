# Fourmolu config for this repo. Generated from `fourmolu --print-defaults`
# and tuned to match this codebase's existing conventions as closely as
# Fourmolu's options allow -- see
# docs/solution-proposals/haskell-auto-formatting.md for the survey this
# was based on and why some conventions (manual `=`/import-column
# alignment) couldn't be preserved by any actively-maintained formatter.

# Number of spaces per indentation step -- this codebase indents 2, not
# Fourmolu's own default of 4.
indentation: 2

# Max line length for automatic line breaking
column-limit: none

# Styling of arrows in type signatures (choices: trailing, leading, or leading-args)
function-arrows: trailing

# How to place commas in multi-line lists, records, etc. (choices: leading or trailing)
comma-style: leading

# Styling of import/export lists (choices: leading, trailing, or diff-friendly)
# -- "leading" matches this codebase's existing multi-line import lists
# (e.g. Common.Validation's import in Post.hs), which lead with the comma
# rather than trail it.
import-export-style: leading

# Rules for grouping import declarations
import-grouping: legacy

# Whether to full-indent or half-indent 'where' bindings past the preceding body
# -- full-indent (true) is what puts `where` at the same 2-space indent as
# the function body and its bindings a further 2 spaces in, matching this
# codebase's convention (see e.g. Config.App.loadAppConfig).
indent-wheres: true

# Whether to leave a space before an opening record brace -- this
# codebase's record-update syntax always has one (e.g.
# `(entityVal nd) { M.nodeDescription = ... }`).
record-brace-space: true

# Number of spaces between top-level declarations
newlines-between-decls: 1

# How to print Haddock comments (choices: single-line, multi-line, or multi-line-compact)
haddock-style: multi-line

# How to print module docstring
haddock-style-module: null

# Styling of let blocks (choices: auto, inline, newline, or mixed)
let-style: auto

# How to align the 'in' keyword with respect to the 'let' keyword (choices: left-align, right-align, or no-space)
in-style: right-align

# Whether to put parentheses around a single constraint (choices: auto, always, or never)
# -- this codebase never parenthesizes a single constraint (e.g.
# `validatePayload :: Monad m => ...`).
single-constraint-parens: never

# Whether to put parentheses around a single deriving class (choices: auto, always, or never)
# -- this codebase writes bare `deriving Show`, not `deriving (Show)`
# (see Domain.Project.Model).
single-deriving-parens: never

# Whether to sort constraints
sort-constraints: false

# Whether to sort derived classes
sort-derived-classes: false

# Whether to sort deriving clauses
sort-deriving-clauses: false

# Whether to place section operators (those that are infixr 0, such as $) in trailing position, continuing the expression indented below
trailing-section-operators: true

# Output Unicode syntax (choices: detect, always, or never)
unicode: never

# Give the programmer more choice on where to insert blank lines
respectful: true

# Fixity information for operators
fixities: []

# Module reexports Fourmolu should know about
reexports: []

# Modules defined by the current Cabal package for import grouping
local-modules: []
